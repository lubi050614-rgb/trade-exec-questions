schema: spec-driven
context: |
  Write human-facing artifacts in Chinese; retain OpenSpec headings and SHALL/MUST.
  Preserve 13 pipelines, 115 nodes and 1150 stable question IDs.
  Default experiment: frozen 200-stock universe, five verified trading days; calibration history is separate.
  Schema evidence in data/schema does not establish coverage, units or historical availability.
  Synthetic events validate engineering; real execution quality, compliance and hardware latency require external evidence.
  A planning change does not implement data generators, database access or teacher inference.
rules:
  tasks:
    - Each task has dependencies, outputs and observable acceptance evidence.
    - Check tasks only when implementation and validation exist, not when planned.
  specs:
    - Every requirement has a concrete Scenario and failure behavior.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
